add(1,"Lesson 1 \u2014 Operating Systems, RAM & ROM","<p class=\"explain\">Learning intention: Operating Systems, RAM &amp; ROM. Use your workbook to record definitions, complete activities and practise exam questions.</p><div class=\"diagram\"><span>Learn</span><b>\u2192</b><span>Recall</span><b>\u2192</b><span>Apply</span><b>\u2192</b><span>Exam practice</span></div>","Introduction");
add(1,"What is software?","<p class=\"explain\">System software controls hardware and manages computer resources. The operating system (OS) is essential system software; utility programs maintain and optimise the system. Application software helps a user complete a specific task, such as writing a document.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(1,"Operating system","<p class=\"explain\">An OS manages hardware and other software and provides a user interface. Examples include Windows, macOS, iOS and Android. Booting up loads the OS into RAM.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(1,"RAM \u2014 Random Access Memory","<p class=\"explain\">RAM is volatile main memory. It temporarily holds programs, instructions and data currently in use. Its contents are lost when power is switched off.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(1,"ROM \u2014 Read Only Memory","<p class=\"explain\">ROM is non-volatile memory. It retains its contents without power and typically stores firmware/start-up instructions. ROM is not used to hold ordinary working documents.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(1,"Allocating memory","<p class=\"explain\">Secondary storage means long-term, non-volatile storage, such as an SSD or hard disk drive. It keeps files and programs even when the computer is switched off. When a program is opened, the OS loads the required instructions and data from secondary storage into RAM. The OS tracks free and occupied RAM and allocates available memory to running programs. Data or programs needed from secondary storage are loaded into RAM; memory may be released when a process finishes. Virtual memory can use storage when RAM is insufficient.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(1,"Allocating storage","<p class=\"explain\">Secondary storage is where files and programs are kept long term, even when power is off (for example, on an SSD or hard disk). The OS decides where new files are saved and manages the available space. The OS file management system organises files and folders, finds files, tracks free storage space and allocates space for new files on secondary storage such as SSDs and hard drives.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(1,"Allocating processing time","<p class=\"explain\">The OS schedules CPU time between processes so several programs appear to run simultaneously. It responds to interrupts (such as keyboard input), switching attention when needed. Excessive CPU demand can slow the computer.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(1,"Other OS functions","<p class=\"explain\">The OS uses device drivers to communicate with peripherals and provides a graphical user interface (GUI) to open and control applications.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(1,"Retrieval \u2014 Match the terms","<p>Use workbook section B. Match each definition to its keyword, then reveal the answers.</p><div class=\"question\"><strong>CPU time allocated to tasks</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Processing time</div></div><div class=\"question\"><strong>Non-volatile memory holding firmware</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">ROM</div></div><div class=\"question\"><strong>Volatile working memory</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">RAM</div></div><div class=\"question\"><strong>Performs a task for the user</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Application software</div></div><div class=\"question\"><strong>Controls hardware and manages the computer</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">System software</div></div>","Retrieval");
add(1,"Retrieval \u2014 Missing words","<p>Complete workbook section C before revealing each answer.</p><div class=\"question\"><strong>The OS allocates free _____ to running programs.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">RAM</div></div><div class=\"question\"><strong>_____ keeps its contents when the power is switched off.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">ROM</div></div><div class=\"question\"><strong>The OS allocates _____ space for files and folders.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">storage</div></div>","Retrieval");
add(1,"Apply your learning","<p>Complete workbook section D. Explain your reasoning.</p><div class=\"question\"><strong>Explain why opening many applications might make a computer slow.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">The OS must share CPU time and RAM among more processes; when resources are heavily used, responses can slow.</div></div><div class=\"question\"><strong>A pupil saves a document. Which OS function is involved?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Storage/file management: the OS finds and allocates space for the file.</div></div>","Application");
add(1,"CCEA exam practice \u2014 2018 Unit 1 Q5(b)(i) [2]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Apart from allocating memory, list two other resources managed by system software.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Storage and processing time.</div></div>","Past paper");
add(1,"CCEA exam practice \u2014 2018 Unit 1 Q5(b)(ii) [3]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Explain how memory is allocated by system software when a user wants to access data held on a hard disk.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">The OS identifies the data on secondary storage, allocates available RAM, and loads/copies the required data into RAM for use.</div></div>","Past paper");
add(1,"CCEA exam practice \u2014 2019 Unit 1 Q5(a)(ii) [2]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>What is the purpose of ROM in a computer system?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Non-volatile memory holding firmware/start-up instructions, retained when power is off.</div></div>","Past paper");
add(1,"CCEA exam practice \u2014 2024 Unit 1 RAM/ROM table [4]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Classify: non-volatile; read-only; loses data on shutdown; holds current instructions.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">ROM; ROM; RAM; RAM.</div></div>","Past paper");
add(1,"CCEA exam practice \u2014 2025 Unit 1 Q4(a) [1]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Name the sequence of loading an operating system into RAM when a computer is turned on.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Booting up.</div></div>","Past paper");
add(1,"Lesson 1 \u2014 Exit ticket","<p class=\"explain\">Without looking at your notes: explain two important terms from this lesson. Then identify one topic to revise.</p><p>Complete workbook section F.</p>","Exit ticket");
add(2,"Lesson 2 \u2014 Modes of Processing","<p class=\"explain\">Learning intention: Modes of Processing. Use your workbook to record definitions, complete activities and practise exam questions.</p><div class=\"diagram\"><span>Learn</span><b>\u2192</b><span>Recall</span><b>\u2192</b><span>Apply</span><b>\u2192</b><span>Exam practice</span></div>","Introduction");
add(2,"What is a processing mode?","<p class=\"explain\">A processing mode describes how and when a computer processes incoming data and how resources are shared.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(2,"Real-time processing","<p class=\"explain\">Data is processed immediately as it is collected, producing a timely response. Examples: online airline seat booking, car engine management, live stock updates. In control systems, low latency is important.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(2,"Batch processing","<p class=\"explain\">Similar jobs/data are collected and processed together later, often automatically and without user intervention. Examples: payroll, electricity bills and overnight invoice processing.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(2,"Multi-user processing","<p class=\"explain\">Several users access the same computer resources. CPU time and resources are shared between users so each experiences a responsive system. Example: an online gaming server.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(2,"Compare them","<p class=\"explain\">Real-time = immediate processing; batch = grouped and delayed processing; multi-user = sharing computing resources between users. Multi-user describes users, not necessarily when data is processed.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(2,"Retrieval \u2014 Match the terms","<p>Use workbook section B. Match each definition to its keyword, then reveal the answers.</p><div class=\"question\"><strong>Delay between input and response</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Latency</div></div><div class=\"question\"><strong>Shares CPU/resources among users</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Multi-user</div></div><div class=\"question\"><strong>Processes collected jobs together later</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Batch</div></div><div class=\"question\"><strong>Processes data immediately</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Real-time</div></div>","Retrieval");
add(2,"Retrieval \u2014 Missing words","<p>Complete workbook section C before revealing each answer.</p><div class=\"question\"><strong>An online seat booking system uses _____ processing.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">real-time</div></div><div class=\"question\"><strong>Electricity bills may be produced using _____ processing.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">batch</div></div><div class=\"question\"><strong>A shared game server is a _____ system.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">multi-user</div></div>","Retrieval");
add(2,"Apply your learning","<p>Complete workbook section D. Explain your reasoning.</p><div class=\"question\"><strong>Why is batch processing suitable for monthly bills?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Many similar records can be processed together automatically at a scheduled time.</div></div><div class=\"question\"><strong>Why must an airline booking system use real-time processing?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Seat availability must update immediately to prevent conflicting reservations.</div></div>","Application");
add(2,"CCEA exam practice \u2014 2018 Unit 1 Q5(c) [4]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Complete the processing-mode paragraph using: airline booking systems, batch processing, real-time processing, billing systems.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">batch processing; billing systems; real-time processing; airline booking systems.</div></div>","Past paper");
add(2,"CCEA exam practice \u2014 2022 Unit 1 Q1(d) [1]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Which mode processes online bookings immediately as data is entered?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Real-time processing (option B).</div></div>","Past paper");
add(2,"CCEA exam practice \u2014 2023 Unit 1 Q5(c) [2]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Identify the modes: immediate processing on collection; sharing CPU time/resources among many users.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Real-time; multi-user.</div></div>","Past paper");
add(2,"Lesson 2 \u2014 Exit ticket","<p class=\"explain\">Without looking at your notes: explain two important terms from this lesson. Then identify one topic to revise.</p><p>Complete workbook section F.</p>","Exit ticket");
add(3,"Lesson 3 \u2014 Utility Software","<p class=\"explain\">Learning intention: Utility Software. Use your workbook to record definitions, complete activities and practise exam questions.</p><div class=\"diagram\"><span>Learn</span><b>\u2192</b><span>Recall</span><b>\u2192</b><span>Apply</span><b>\u2192</b><span>Exam practice</span></div>","Introduction");
add(3,"What is utility software?","<p class=\"explain\">Utility software helps configure, maintain, analyse and optimise a computer system. It is a type of system software.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(3,"Disk defragmentation","<p class=\"explain\">On a magnetic hard disk drive, file fragments can be scattered across the disk. Defragmentation rearranges them into contiguous areas so reading them can be faster. This is not a routine optimisation for SSDs.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(3,"Task scheduling","<p class=\"explain\">Allows programs, scripts, updates or backups to run automatically at predefined times or intervals. Example: run a backup each Friday evening.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(3,"Backing up data","<p class=\"explain\">A backup is an additional copy of files stored separately so data can be recovered after loss, corruption or device failure. Backups may be stored on an external drive or in the cloud.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(3,"Full and incremental backups","<p class=\"explain\">A full backup copies all selected data. An incremental backup copies only data changed since the most recent backup, reducing routine backup time and storage use.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(3,"Restoring data","<p class=\"explain\">Restoring means recovering data from a backup copy. Check that backups are usable and can be restored; simply making a copy is not the same as testing recovery.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(3,"Retrieval \u2014 Match the terms","<p>Use workbook section B. Match each definition to its keyword, then reveal the answers.</p><div class=\"question\"><strong>Copies changes since previous backup</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Incremental backup</div></div><div class=\"question\"><strong>Recover data from a backup</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Restore</div></div><div class=\"question\"><strong>Additional copy of data</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Backup</div></div><div class=\"question\"><strong>Runs jobs at specified times</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Task scheduling</div></div><div class=\"question\"><strong>Reorganises HDD file fragments</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Defragmentation</div></div>","Retrieval");
add(3,"Retrieval \u2014 Missing words","<p>Complete workbook section C before revealing each answer.</p><div class=\"question\"><strong>A _____ backup copies all selected files.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">full</div></div><div class=\"question\"><strong>A _____ backup copies changes since the previous backup.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">incremental</div></div><div class=\"question\"><strong>_____ puts fragmented HDD file sections together.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">defragmentation</div></div>","Retrieval");
add(3,"Apply your learning","<p>Complete workbook section D. Explain your reasoning.</p><div class=\"question\"><strong>Why is defragmentation more relevant to HDDs than SSDs?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">HDDs use moving read/write heads, so nearby fragments reduce seeking; SSDs do not have moving heads.</div></div><div class=\"question\"><strong>A business loses a folder. What should it do?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Restore the missing folder from a suitable backup.</div></div>","Application");
add(3,"CCEA exam practice \u2014 2018 Unit 1 Q12 [1]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Name the utility that rearranges file data into blocks so it can be read more quickly.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Defragmenting.</div></div>","Past paper");
add(3,"CCEA exam practice \u2014 2019 Unit 1 Q5(b) [4]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Describe the function of disk defragmenting and task scheduling.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Defragmenting rearranges HDD file fragments together to improve access; task scheduling automatically runs selected jobs at set times.</div></div>","Past paper");
add(3,"CCEA exam practice \u2014 2023 Unit 1 Q5(d) [1]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Which software group does defragmentation belong to?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Utility software.</div></div>","Past paper");
add(3,"CCEA exam practice \u2014 2025 Unit 1 Q1(d) [1]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Which task is carried out by utility applications?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Backup and restoring data (option D).</div></div>","Past paper");

add(4,"What is a virus?","<p class=\"explain\">A computer virus is malicious software that can replicate by infecting other files or programs. It may damage, alter or corrupt data and interfere with normal computer operation.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(4,"What antivirus software does","<p class=\"explain\">Antivirus software scans files and activity to detect known and suspicious threats. It can block, quarantine (isolate) or remove malicious files to protect the system.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(4,"Why updates matter","<p class=\"explain\">New threats emerge and existing threats change. Antivirus software needs regular updates to its threat definitions and detection engine so it can recognise and respond to newer malware.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(4,"Practical protection","<p class=\"explain\">Keep antivirus and the OS updated, avoid suspicious downloads or attachments, and maintain backups. Antivirus lowers risk but does not guarantee protection against every threat.</p><p class=\"hint\">Workbook section A: write a clear definition and an example.</p>","Learn");
add(4,"Retrieval \u2014 Match the terms","<p>Use workbook section B. Match each definition to its keyword, then reveal the answers.</p><div class=\"question\"><strong>Adds recognition of new threats</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Definitions update</div></div><div class=\"question\"><strong>Detects and blocks malware</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Antivirus</div></div><div class=\"question\"><strong>Isolate a suspicious file</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Quarantine</div></div><div class=\"question\"><strong>Malicious program that can replicate</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Virus</div></div>","Retrieval");
add(4,"Retrieval \u2014 Missing words","<p>Complete workbook section C before revealing each answer.</p><div class=\"question\"><strong>Antivirus software can _____ a suspicious file to isolate it.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">quarantine</div></div><div class=\"question\"><strong>Regular _____ help antivirus detect newly discovered threats.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">updates</div></div><div class=\"question\"><strong>A computer _____ can replicate by infecting files.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">virus</div></div>","Retrieval");
add(4,"Apply your learning","<p>Complete workbook section D. Explain your reasoning.</p><div class=\"question\"><strong>Why is installing antivirus only once insufficient?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Threats change, so regular software and definition updates are required to detect newer threats.</div></div><div class=\"question\"><strong>What is the difference between quarantining and deleting?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Quarantine isolates a file to prevent harm; deletion removes it.</div></div>","Application");
add(4,"CCEA exam practice \u2014 2025 Unit 1 Q1(c) [1]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Which option best describes the role of antivirus software?</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Protects against malicious attacks (option B).</div></div>","Past paper");
add(4,"CCEA exam practice \u2014 Teacher-written exam-style [4]","<p class=\"hint\">Write your answer in workbook section E. Check the marks and then reveal suggested marking points.</p><div class=\"question\"><strong>Describe two functions of antivirus software and explain why it must be updated regularly.</strong><br><button class=\"reveal\" onclick=\"let a=this.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block';this.textContent=a.style.display==='block'?'Hide answer':'Reveal answer'\">Reveal answer</button><div class=\"answer\">Detects/scans for malware; blocks/quarantines/removes threats; updates recognise newly emerging malware.</div></div>","Exam-style");

function visualFor(s){const a=visualPlans[s.title];if(!a||s.kind!=='Learn')return '';const positions=[12,277,542];let boxes=a.map((v,i)=>`<rect class="box${'abc'[i]}" x="${positions[i]}" y="30" width="235" height="105" rx="15"/><text x="${positions[i]+117.5}" y="75" text-anchor="middle" font-size="17">${v.length>21?v.slice(0,21)+'…':v}</text>`).join('');let arrows=[247,512].map(x=>`<path d="M${x} 82 h25 m-9 -9 l9 9 -9 9" fill="none" stroke="#34699b" stroke-width="3"/>`).join('');return `<figure class="visual" role="img" aria-label="Diagram: ${a.join(' then ')}"><svg viewBox="0 0 790 165" xmlns="http://www.w3.org/2000/svg">${boxes}${arrows}</svg><figcaption>Visual summary: ${a.join(' → ')}</figcaption></figure>`}
document.getElementById('slides').innerHTML=slides.map((s,i)=>`<section class="slide" id="slide${i}"><div class="eyebrow">Lesson ${s.lesson} • ${s.kind}</div><h1>${s.title}</h1>${visualFor(s)}${s.body}</section>`).join('');function show(){document.querySelectorAll('.slide').forEach((x,i)=>x.classList.toggle('active',i===current));document.querySelectorAll('aside button').forEach((x,i)=>x.classList.toggle('active',i===slides[current].lesson-1));document.getElementById('count').textContent=`Slide ${current+1} of ${slides.length}`;document.getElementById('position').textContent=`${current+1} / ${slides.length}`;window.scrollTo(0,0)}function move(n){current=Math.max(0,Math.min(slides.length-1,current+n));show()}function goLesson(n){current=slides.findIndex(x=>x.lesson===n);show()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});show();</script></body></html>
